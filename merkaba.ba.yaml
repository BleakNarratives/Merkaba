name: merkaba-unified-synthesis
version: "1.0.0"
intent: |
  Synthesize behavioral precision (Ka / MikeySwarm) with creative intelligence
  (Ba / Bardildo) into a unified, intent-driven agent consciousness. Operates without
  bloated MCP sockets or Pokémon SKILL.md scaffolding. Pure intent, signed contracts,
  and zero-dependency axiom enforcement.

success_criteria:
  - Merges structured behavioral scoring (Ka) with creative lateral analysis (Ba)
  - Enforces all 8 Root Ba Axioms cleanly
  - Operates purely on intent declarations without socket dependencies
  - Produces SHA-256 signed execution contracts
  - All outputs conform to strict scope bounds

scope:
