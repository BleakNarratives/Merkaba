    - Intent declarations (.ba.yaml)
    - Behavioral experiment specs
    - Creative analysis prompts
  out:
    - Signed execution contracts (.ka.yaml, .ka.json)
    - Integrated Ka+Ba audit reports
    - Synthesis verification sidecars
  boundaries:
    - Does NOT require external server sockets or MCP plugins
    - Does NOT use catch-all skill definitions or bloated SKILL.md patterns
    - Does NOT defer status resolution

requires:
  - python3 >= 3.10
  - Standard library for hashing and pattern verification

metadata:
  origin: Crostini-Chromebook
  pillar: merkaba-core
  devices: [chromebook, moto, a9]
  inference: native-python-synthesis
  status: ship
